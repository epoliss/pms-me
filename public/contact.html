<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOA-PMS — Contact Us</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;color:#222}
header{background:rgba(64,224,208,.78);color:#a6a6a6;text-align:center;padding:18px 20px 22px;overflow:hidden}
.header-home{display:block;width:max-content;margin:0 auto;color:inherit;text-decoration:none}
.logo{display:block;width:max-content;margin:0 auto;text-align:left;font-size:42px;font-weight:800;letter-spacing:2px;line-height:.92;white-space:nowrap}
.brand-line{display:block}.brand-management{margin-left:1.4em}.brand-stories{margin-left:calc(2.7em + 1ch)}
.black{color:#000}.gray{color:#a6a6a6}.brand-tagline{color:#000;font-size:24px;letter-spacing:1px;margin-left:8px;vertical-align:middle}
.container{max-width:700px;margin:30px auto;padding:0 15px}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{margin:0 0 8px;font-size:25px}.intro{color:#666;line-height:1.5;margin:0 0 22px}
label{display:block;font-weight:bold;font-size:14px;margin:18px 0 7px}
input,textarea{width:100%;border:1px solid #ccc;border-radius:4px;padding:11px;font:15px Arial,Helvetica,sans-serif}
textarea{min-height:180px;resize:vertical}.field-note{margin-top:5px;color:#777;font-size:12px;text-align:right}.hp{position:absolute;left:-9999px}
button{margin-top:20px;border:0;border-radius:5px;padding:12px 18px;font-size:14px;font-weight:bold;cursor:pointer;background:rgba(64,224,208,.78);color:#000}
.message{display:none;margin-top:18px;padding:12px;border-radius:4px}.success{display:block;background:#e7f5e9;color:#176b2c}.error{display:block;background:#fdeaea;color:#9b1c1c}
.turnstile{margin-top:18px;min-height:70px}.verify-label{font-weight:bold;font-size:14px;margin-top:18px}.verify-status{font-size:12px;color:#777;margin-top:6px}footer{text-align:center;color:#888;font-size:12px;padding:30px 15px 45px}footer a{color:inherit}
@media(max-width:900px){.logo{font-size:38px;letter-spacing:1.5px}.brand-tagline{font-size:22px}}
@media(max-width:600px){header{padding:16px 12px 18px}.logo{font-size:27px}.brand-management{margin-left:1.3em}.brand-stories{margin-left:calc(2.5em + 1ch)}.brand-tagline{font-size:15px;letter-spacing:.2px;margin-left:3px}.card{padding:18px}}
html[data-theme="dark"] body{background:#181818;color:#e8e8e8}html[data-theme="dark"] .card{background:#242424;border-color:#444}html[data-theme="dark"] input,html[data-theme="dark"] textarea{background:#303030;color:#f2f2f2;border-color:#555}html[data-theme="dark"] .intro{color:#aaa}
</style>
</head>
<body>
<header><a href="/" class="header-home"><div class="logo">
<div class="brand-line"><span class="black">P</span><span class="gray">ROPERTY</span></div>
<div class="brand-line brand-management"><span class="black">M</span><span class="gray">ANAGEMENT</span></div>
<div class="brand-line brand-stories"><span class="black">S</span><span class="gray">TORIES</span><span class="brand-tagline">. . . for every day</span></div>
</div></a></header>
<main class="container"><div class="card">
<h1>Contact Us</h1>
<p class="intro">Questions, comments, or something we should know? Send HOA-PMS a message below.</p>
<form id="contactForm">
<label for="name">Name</label><input id="name" maxlength="100" required autocomplete="name">
<label for="email">Email</label><input id="email" type="email" maxlength="254" required autocomplete="email">
<label for="subject">Subject</label><input id="subject" maxlength="150" required><div class="field-note"><span id="subjectCount">0</span> / 150 characters</div>
<label for="messageText">Message</label><textarea id="messageText" maxlength="2000" required></textarea><div class="field-note"><span id="messageCount">0</span> / 2,000 characters</div>
<div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
<div class="verify-label">Human Verification</div>
<div class="turnstile" id="turnstileContainer"></div>
<div class="verify-status" id="verifyStatus">Loading verification…</div>
<button id="sendButton" type="submit">Send Message</button>
<div id="formMessage" class="message" role="status"></div>
</form></div></main>
<footer>Property Manager Stories · HOA-PMS<br><a href="/">Back to Stories</a> · <a href="/privacy.html">Privacy Policy</a></footer>
<script>
(function(){const saved=localStorage.getItem("pmsme_theme");if(saved==="dark")document.documentElement.dataset.theme="dark";})();
let turnstileWidgetId=null;
const CONTACT_TURNSTILE_SITE_KEY="0x4AAAAAAFIAtb7mGYRfxIcu";
async function setupTurnstile(){
 const status=document.getElementById("verifyStatus");
 try{
  const script=document.createElement("script");
  script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
  script.async=true;
  script.onerror=()=>{status.textContent="Human verification could not load. Please refresh the page.";};
  script.onload=()=>{
   try{
    turnstileWidgetId=turnstile.render("#turnstileContainer",{
     sitekey:CONTACT_TURNSTILE_SITE_KEY,
     theme:document.documentElement.dataset.theme==="dark"?"dark":"auto",
     callback:()=>{status.textContent="Verification complete.";},
     "expired-callback":()=>{status.textContent="Verification expired. Please verify again.";},
     "error-callback":()=>{status.textContent="Human verification could not be completed. Please refresh the page.";}
    });
    status.textContent="Please complete the verification above.";
   }catch(error){
    status.textContent="Human verification could not load. Please refresh the page.";
    console.error("Contact Turnstile render failed:",error);
   }
  };
  document.head.appendChild(script);
 }catch(error){
  status.textContent="Human verification could not load. Please refresh the page.";
  console.error("Contact Turnstile setup failed:",error);
 }
}
setupTurnstile();
const subjectInput=document.getElementById("subject");
const messageInput=document.getElementById("messageText");
function updateCounts(){
 document.getElementById("subjectCount").textContent=subjectInput.value.length;
 document.getElementById("messageCount").textContent=messageInput.value.length;
}
subjectInput.addEventListener("input",updateCounts);
messageInput.addEventListener("input",updateCounts);
updateCounts();
document.getElementById("contactForm").addEventListener("submit",async e=>{
 e.preventDefault();const out=document.getElementById("formMessage"),btn=document.getElementById("sendButton");
 out.className="message";out.style.display="block";out.textContent="Sending...";btn.disabled=true;
 try{
  const token=(window.turnstile&&turnstileWidgetId!==null)?turnstile.getResponse(turnstileWidgetId):"";
  if(!window.turnstile||turnstileWidgetId===null||!token)throw new Error("Please complete the human verification before sending your message.");
  const r=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   name:document.getElementById("name").value,email:document.getElementById("email").value,subject:document.getElementById("subject").value,
   message:document.getElementById("messageText").value,website:document.getElementById("website").value,turnstile_token:token
  })});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to send your message.");
  e.target.reset();updateCounts();out.className="message success";out.textContent="Thank you. Your message has been sent to HOA-PMS.";
 }catch(err){out.className="message error";out.textContent=err.message;}
 finally{btn.disabled=false;if(window.turnstile&&turnstileWidgetId!==null)turnstile.reset(turnstileWidgetId);}
});
</script>
</body></html>
