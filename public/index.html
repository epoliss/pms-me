<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMS-ME — Property Manager Stories</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222
}

header{
  background:#202020;
  color:#fff;
  text-align:center;
  padding:24px 20px 18px
}

.logo{
  font-size:42px;
  font-weight:800;
  letter-spacing:2px
}

.subtitle{
  margin-top:4px;
  color:#d6d6d6
}

nav{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px 10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:5;
  overflow-x:auto;
  white-space:nowrap
}

nav button{
  border:0;
  background:transparent;
  padding:7px 10px;
  margin:2px;
  font-size:14px;
  cursor:pointer;
  color:#555;
  border-radius:4px
}

nav button:hover,
nav button.active{
  background:#222;
  color:#fff
}

.container{
  max-width:850px;
  margin:24px auto;
  padding:0 15px
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

h1{
  margin:0;
  font-size:24px
}

.submit{
  background:#222;
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  border-radius:5px;
  font-weight:bold;
  font-size:14px
}

.story{
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)
}

.story.highlighted{
  box-shadow:0 0 0 3px #222
}

.meta{
  color:#888;
  font-size:12px;
  margin-bottom:12px
}

.story p{
  font-size:17px;
  line-height:1.55;
  margin:0 0 14px
}

.pms{
  font-weight:800;
  font-size:14px;
  letter-spacing:.5px
}

/* =========================================================
   REACTION BUTTONS
   ========================================================= */

.actions{
  border-top:1px solid #eee;
  padding-top:12px;
  display:flex;
  gap:14px;
  flex-wrap:wrap
}

.reaction{
  border:1px solid #d5d5d5;
  background:#f7f7f7;
  color:#555;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  padding:7px 10px;
  border-radius:5px;
  transition:
    background .15s ease,
    color .15s ease,
    border-color .15s ease;
  display:inline-flex;
  align-items:center;
  gap:7px
}

.reaction .count{
  font-weight:800
}

.reaction-left:hover{
  background:#b9dcf5;
  color:#fff;
  border-color:#9bc9e8
}

.reaction-left.selected{
  background:#8fc7ee;
  color:#fff;
  border-color:#78b8e2;
  cursor:default
}

.reaction-right:hover{
  background:#e58b32;
  color:#fff;
  border-color:#d77a1e
}

.reaction-right.selected{
  background:#d9781c;
  color:#fff;
  border-color:#c86a12;
  cursor:default
}

.reaction:disabled{
  opacity:1
}

/* =========================================================
   SHARE BUTTONS
   ========================================================= */

.share-actions{
  border-top:1px solid #eee;
  margin-top:18px;
  padding-top:12px;
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap
}

.share-button{
  width:32px;
  height:32px;
  min-width:32px;
  padding:0;
  border:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease
}

.share-button:hover{
  transform:translateY(-1px);
  opacity:.88;
  box-shadow:0 2px 5px rgba(0,0,0,.18)
}

.share-button:active{
  transform:translateY(0);
  box-shadow:none
}

.share-button:focus-visible{
  outline:2px solid #222;
  outline-offset:3px
}

.share-x{
  background:#000;
  color:#fff;
  border-radius:5px;
  font-size:23px;
  font-weight:700
}

.share-facebook{
  background:#1877f2;
  color:#fff;
  border-radius:50%;
  font-family:Arial,Helvetica,sans-serif;
  font-size:27px;
  font-weight:700;
  padding-top:3px
}

.share-native{
  background:#555;
  color:#fff;
  border-radius:5px;
  font-size:19px;
  font-weight:700
}

.mobile-share{
  display:inline-flex
}

.empty{
  display:none;
  background:#fff;
  border:1px solid #ddd;
  padding:35px;
  text-align:center;
  color:#777
}

.loading{
  background:#fff;
  border:1px solid #ddd;
  padding:35px;
  text-align:center;
  color:#777
}

footer{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:30px 15px 45px
}

@media(max-width:600px){

  .logo{
    font-size:34px
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
    gap:12px
  }

  .submit{
    align-self:stretch;
    text-align:center
  }

  .desktop-share{
    display:inline-flex
  }

  .mobile-share{
    display:inline-flex
  }

  .share-actions{
    gap:22px;
    margin-top:18px
  }

  .share-button{
    width:32px;
    height:32px;
    min-width:32px
  }

  .actions{
    gap:10px
  }

  .reaction{
    font-size:12px;
    padding:7px 8px
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">PMS-ME</div>
  <div class="subtitle">Property Manager Stories</div>
</header>

<nav id="categories">
  <button class="active" data-category="All">All</button>

  <button data-category="Homeowner of the Year">
    Homeowner of the Year
  </button>

  <button data-category="Vendor Woes">
    Vendor Woes
  </button>

  <button data-category="Legally Blunt">
    Legally Blunt
  </button>

  <button data-category="Board to Tears">
    Board to Tears
  </button>

  <button data-category="Audit This">
    Audit This
  </button>
</nav>

<main class="container">

  <div class="topbar">
    <h1>The Tops</h1>

    <a class="submit" href="/submit.html">
      Submit a Story
    </a>
  </div>

  <section id="stories">
    <div class="loading" id="loading">
      Loading stories...
    </div>
  </section>

  <div class="empty" id="empty">
    No stories in this category yet.
  </div>

</main>

<footer>
  Property Manager Stories · PMS-ME<br>
  Because sometimes you just have to laugh.
</footer>

<script>

const buttons =
  document.querySelectorAll(
    '#categories button'
  );

const storiesContainer =
  document.getElementById('stories');

const empty =
  document.getElementById('empty');

let stories = [];

/* =========================================================
   DATE FORMATTING
   ========================================================= */

function formatDate(dateString){

  const date = new Date(dateString);
  const now = new Date();

  const today = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  const storyDay = new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  );

  const difference =
    Math.round(
      (today - storyDay) / 86400000
    );

  if(difference === 0)
    return 'Today';

  if(difference === 1)
    return 'Yesterday';

  return date.toLocaleDateString(
    undefined,
    {
      month:'short',
      day:'numeric',
      year:
        date.getFullYear() !== now.getFullYear()
          ? 'numeric'
          : undefined
    }
  );
}

/* =========================================================
   STORY SHARING
   ========================================================= */

function getStoryUrl(story){

  const url =
    new URL(
      window.location.origin + '/'
    );

  url.searchParams.set(
    'story',
    story.id
  );

  return url.toString();
}

function getShareText(story){

  return `PMS-ME — ${story.story}`;
}

function shareToX(story){

  const shareUrl =
    'https://twitter.com/intent/tweet?' +
    new URLSearchParams({
      text:getShareText(story),
      url:getStoryUrl(story)
    }).toString();

  window.open(
    shareUrl,
    '_blank',
    'width=600,height=500,noopener,noreferrer'
  );
}

function shareToFacebook(story){

  const shareUrl =
    'https://www.facebook.com/sharer/sharer.php?' +
    new URLSearchParams({
      u:getStoryUrl(story)
    }).toString();

  window.open(
    shareUrl,
    '_blank',
    'width=600,height=500,noopener,noreferrer'
  );
}

async function shareNative(story){

  const storyUrl =
    getStoryUrl(story);

  const shareData = {
    title:
      'PMS-ME — Property Manager Stories',

    text:
      getShareText(story),

    url:
      storyUrl
  };

  if(!navigator.share){

    alert(
      'Your browser does not support the Share feature. You can copy the story URL from your browser and share it manually.'
    );

    return;
  }

  try{

    if(
      navigator.canShare &&
      !navigator.canShare(shareData)
    ){

      await navigator.share({
        title:shareData.title,
        text:shareData.text
      });

    }else{

      await navigator.share(
        shareData
      );
    }

  }catch(error){

    if(
      error.name !== 'AbortError'
    ){

      console.error(
        'Share failed:',
        error
      );
    }
  }
}

/* =========================================================
   REACTION LABELS
   ========================================================= */

const reactionLabels = {

  'Homeowner of the Year': [
    'YEP, IT’S A TRAINWRECK',
    'ASSHOLE MANAGER'
  ],

  'Vendor Woes': [
    'YEP, IT’S A TRAINWRECK',
    'GLAD I DON’T WORK FOR YOU'
  ],

  'Legally Blunt': [
    'YEP, IT’S A TRAINWRECK',
    'DID YOU GET YOUR LAW DEGREE IN A BAR?'
  ],

  'Board to Tears': [
    'YEP, IT’S A TRAINWRECK',
    'SIT THIS ONE OUT'
  ],

  'Audit This': [
    'YEP, IT’S A TRAINWRECK',
    'LEAVE IT TO ACCOUNTANTS'
  ]
};

/* =========================================================
   REACTION STORAGE
   ========================================================= */

function reactionStorageKey(
  storyId,
  reaction
){

  return `pmsme_reaction_${storyId}_${reaction}`;
}

function hasReacted(
  storyId,
  reaction
){

  try{

    return (
      localStorage.getItem(
        reactionStorageKey(
          storyId,
          reaction
        )
      ) === '1'
    );

  }catch{

    return false;
  }
}

function rememberReaction(
  storyId,
  reaction
){

  try{

    localStorage.setItem(
      reactionStorageKey(
        storyId,
        reaction
      ),
      '1'
    );

  }catch{}
}

/* =========================================================
   SUBMIT REACTION
   ========================================================= */

async function submitReaction(
  story,
  button,
  reaction
){

  if(
    hasReacted(
      story.id,
      reaction
    )
  ){

    return;
  }

  button.disabled = true;

  try{

    const response =
      await fetch(
        `/api/stories/${encodeURIComponent(
          story.id
        )}/reaction`,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            reaction
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        'Unable to record reaction.'
      );
    }

    rememberReaction(
      story.id,
      reaction
    );

    button.classList.add(
      'selected'
    );

    button
      .querySelector('.count')
      .textContent =
        reaction === 'trainwreck'
          ? data.reaction_been_there
          : data.reaction_funny;

    story.reaction_been_there =
      data.reaction_been_there;

    story.reaction_funny =
      data.reaction_funny;

  }catch(error){

    button.disabled = false;

    console.error(
      'Reaction failed:',
      error
    );

    alert(
      'Your reaction could not be recorded. Please try again.'
    );
  }
}

/* =========================================================
   CREATE REACTION BUTTON
   ========================================================= */

function makeReactionButton(
  story,
  reaction,
  label,
  side
){

  const button =
    document.createElement(
      'button'
    );

  button.type = 'button';

  button.className =
    `reaction reaction-${side}`;

  if(
    hasReacted(
      story.id,
      reaction
    )
  ){

    button.classList.add(
      'selected'
    );
  }

  const labelSpan =
    document.createElement(
      'span'
    );

  labelSpan.textContent =
    label;

  const countSpan =
    document.createElement(
      'span'
    );

  countSpan.className =
    'count';

  countSpan.textContent =
    reaction === 'trainwreck'
      ? (story.reaction_been_there || 0)
      : (story.reaction_funny || 0);

  button.appendChild(
    labelSpan
  );

  button.appendChild(
    document.createTextNode(' (')
  );

  button.appendChild(
    countSpan
  );

  button.appendChild(
    document.createTextNode(')')
  );

  button.addEventListener(
    'click',
    () =>
      submitReaction(
        story,
        button,
        reaction
      )
  );

  return button;
}

/* =========================================================
   RENDER STORIES
   ========================================================= */

function renderStories(
  category = 'All'
){

  storiesContainer.innerHTML =
    '';

  const filtered =
    category === 'All'
      ? stories
      : stories.filter(
          story =>
            story.category === category
        );

  if(!filtered.length){

    empty.style.display =
      'block';

    return;
  }

  empty.style.display =
    'none';

  filtered.forEach(
    story => {

      const article =
        document.createElement(
          'article'
        );

      article.className =
        'story';

      article.dataset.category =
        story.category;

      article.dataset.storyId =
        story.id;

      const meta =
        document.createElement(
          'div'
        );

      meta.className =
        'meta';

      meta.textContent =
        `${formatDate(
          story.published_at
        )} · ${
          story.category
        } · ${
          story.public_name ||
          'Anonymous'
        }`;

      const text =
        document.createElement(
          'p'
        );

      text.textContent =
        story.story;

      const pms =
        document.createElement(
          'div'
        );

      pms.className =
        'pms';

      pms.textContent =
        'PMS-ME.';

      /* =====================================================
         REACTION BUTTONS
         ===================================================== */

      const actions =
        document.createElement(
          'div'
        );

      actions.className =
        'actions';

      const labels =
        reactionLabels[
          story.category
        ] || [
          'YEP, IT’S A TRAINWRECK',
          'THAT’S A GOOD ONE'
        ];

      actions.appendChild(
        makeReactionButton(
          story,
          'trainwreck',
          labels[0],
          'left'
        )
      );

      actions.appendChild(
        makeReactionButton(
          story,
          'right',
          labels[1],
          'right'
        )
      );

      /* =====================================================
         SHARE BUTTONS
         ===================================================== */

      const shareActions =
        document.createElement(
          'div'
        );

      shareActions.className =
        'share-actions';

      const xButton =
        document.createElement(
          'button'
        );

      xButton.className =
        'share-button share-x desktop-share';

      xButton.textContent =
        '𝕏';

      xButton.setAttribute(
        'aria-label',
        'Share on X'
      );

      xButton.setAttribute(
        'title',
        'Share on X'
      );

      xButton.addEventListener(
        'click',
        () =>
          shareToX(story)
      );

      const facebookButton =
        document.createElement(
          'button'
        );

      facebookButton.className =
        'share-button share-facebook desktop-share';

      facebookButton.textContent =
        'f';

      facebookButton.setAttribute(
        'aria-label',
        'Share on Facebook'
      );

      facebookButton.setAttribute(
        'title',
        'Share on Facebook'
      );

      facebookButton.addEventListener(
        'click',
        () =>
          shareToFacebook(story)
      );

      const mobileShareButton =
        document.createElement(
          'button'
        );

      mobileShareButton.className =
        'share-button share-native mobile-share';

      mobileShareButton.textContent =
        '↗';

      mobileShareButton.setAttribute(
        'aria-label',
        'Share'
      );

      mobileShareButton.setAttribute(
        'title',
        'Share'
      );

      mobileShareButton.addEventListener(
        'click',
        () =>
          shareNative(story)
      );

      shareActions.append(
        xButton,
        facebookButton,
        mobileShareButton
      );

      /* =====================================================
         ASSEMBLE STORY
         ===================================================== */

      article.append(
        meta,
        text,
        pms,
        actions,
        shareActions
      );

      storiesContainer.appendChild(
        article
      );
    }
  );

  /* =========================================================
     HIGHLIGHT REQUESTED STORY
     ========================================================= */

  const requestedStoryId =
    new URLSearchParams(
      window.location.search
    ).get('story');

  if(requestedStoryId){

    const requestedStory =
      document.querySelector(
        `.story[data-story-id="${CSS.escape(
          requestedStoryId
        )}"]`
      );

    if(requestedStory){

      requestedStory.classList.add(
        'highlighted'
      );

      setTimeout(
        () => {

          requestedStory.scrollIntoView({
            behavior:'smooth',
            block:'center'
          });

        },
        100
      );
    }
  }
}

/* =========================================================
   LOAD PUBLISHED STORIES
   ========================================================= */

async function loadStories(){

  try{

    const response =
      await fetch(
        '/api/stories'
      );

    if(!response.ok){

      throw new Error(
        'Unable to load stories'
      );
    }

    const data =
      await response.json();

    stories =
      Array.isArray(data)
        ? data
        : data.results || [];

    renderStories(
      'All'
    );

  }catch(error){

    storiesContainer.innerHTML =
      '<div class="loading">Unable to load stories right now.</div>';

    console.error(
      error
    );
  }
}

/* =========================================================
   CATEGORY FILTERING
   ========================================================= */

buttons.forEach(
  button => {

    button.addEventListener(
      'click',
      () => {

        buttons.forEach(
          b =>
            b.classList.remove(
              'active'
            )
        );

        button.classList.add(
          'active'
        );

        renderStories(
          button.dataset.category
        );
      }
    );
  }
);

loadStories();

</script>

</body>
</html>
